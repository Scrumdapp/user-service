spring.application.name=user-service
spring.config.import=optional:file:.env[.properties]

server.port=${APPLICATION_PORT:3000}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/scrumdapp}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DATABASE_USER:myuser}
spring.datasource.password=${DATABASE_PASSWORD:secret}

groupService.url=${GROUP_SERVICE_URL:http://localhost:3000}
groupService.userEndpoint=${GROUP_FETCH_ENDPOINT:/groups/user}

passport.jwk-set-uri=${JWK_SET_URI:http://localhost:9999/.well-known/jwks.json}

spring.profiles.active=use_mock_service